# -----------------------------------------------------------------------------
# Pipeline 1: scan the Terraform, then run it in HCP Terraform (API-driven).
#
# Two workspaces, handled by a matrix (each gets its own plan, PR comment and run):
#   terraform/           -> maraton-aws       (app environment)
#   terraform/security/  -> maraton-security  (security baseline)
#
#   pull request -> IaC scan + fmt/validate -> speculative plan in HCP Terraform
#                   -> plan summary + link posted as a PR comment
#   push to main -> IaC scan + fmt/validate -> real run in HCP Terraform, labelled
#                   with the commit -> WAITS for "Confirm & Apply" in the HCP UI
#
# Uses HashiCorp's official tfc-workflows-github actions, which call the HCP
# Terraform API directly: each run shows the commit/PR it came from, and the human
# approval happens in HCP Terraform (workspace auto-apply is off).
# HCP Terraform gets AWS credentials through OIDC; GitHub only holds an HCP
# Terraform API token (secret TF_API_TOKEN), never AWS keys.
# The bootstrap folder is applied by hand from the laptop and isn't deployed here.
# -----------------------------------------------------------------------------
name: iac

on:
  pull_request:
    paths: ["terraform/**", ".trivyignore", ".github/workflows/iac.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".trivyignore", ".github/workflows/iac.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

# Never run two copies of this pipeline at the same time.
concurrency:
  group: iac
  cancel-in-progress: false

env:
  TF_CLOUD_ORGANIZATION: patriciarojas-sandbox

jobs:
  scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # All findings go to the Security tab, including the intentional weaknesses.
      - name: IaC scan (report to Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: sarif
          output: trivy-iac.sarif
          exit-code: "0"

      - name: Upload IaC scan results
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

      # The gate: fail on any HIGH/CRITICAL misconfiguration that isn't a documented,
      # accepted risk in .trivyignore (the exercise's required weaknesses).
      - name: IaC scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: table
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          exit-code: "1"
          skip-setup-trivy: true

  # Quick local checks; -backend=false means no HCP token is needed here.
  lint:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        directory: [terraform, terraform/security]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # ---- Pull requests: speculative plan per workspace, summarised on the PR ----
  plan:
    if: github.event_name == 'pull_request'
    needs: [scan, lint]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: maraton-aws
            directory: ./terraform
          - workspace: maraton-security
            directory: ./terraform/security
    permissions:
      contents: read
      pull-requests: write # to comment the plan summary on the PR
    env:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload configuration (speculative)
        id: upload
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        with:
          workspace: ${{ matrix.workspace }}
          directory: ${{ matrix.directory }}
          speculative: true

      - name: Create plan-only run
        id: run
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        with:
          workspace: ${{ matrix.workspace }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: true
          message: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }} (${{ github.event.pull_request.head.sha }})"

      - name: Get plan summary
        id: plan
        uses: hashicorp/tfc-workflows-github/actions/plan-output@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        with:
          plan: ${{ steps.run.outputs.plan_id }}

      # One comment per workspace per PR (found by a hidden marker), updated on every push.
      - name: Comment plan on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: "<!-- hcp-plan:${{ matrix.workspace }} -->"
          BODY: |
            <!-- hcp-plan:${{ matrix.workspace }} -->
            #### HCP Terraform plan for `${{ matrix.workspace }}`: ${{ steps.plan.outputs.plan_status }}

            | Add | Change | Destroy |
            | --- | --- | --- |
            | ${{ steps.plan.outputs.add }} | ${{ steps.plan.outputs.change }} | ${{ steps.plan.outputs.destroy }} |

            [View the plan in HCP Terraform](${{ steps.run.outputs.run_link }}) · commit `${{ github.event.pull_request.head.sha }}`
        run: |
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${MARKER}\"))) | .id" | tail -n1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${ID}" -f body="$BODY" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi

  # ---- main: real run per workspace, applied by a human in HCP Terraform ----
  run:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [scan, lint]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: maraton-aws
            directory: ./terraform
          - workspace: maraton-security
            directory: ./terraform/security
    env:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload configuration
        id: upload
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        with:
          workspace: ${{ matrix.workspace }}
          directory: ${{ matrix.directory }}

      # First line of the commit message only (squash merges have long bodies).
      - name: Run message
        id: msg
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual run' }}
        run: echo "title=$(printf '%s\n' "$COMMIT_MSG" | head -n1 | cut -c1-120)" >> "$GITHUB_OUTPUT"

      - name: Create run (waits for approval in HCP Terraform)
        id: run
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        with:
          workspace: ${{ matrix.workspace }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          message: "main @ ${{ github.sha }}: ${{ steps.msg.outputs.title }}"

      - name: Get plan summary
        id: plan
        uses: hashicorp/tfc-workflows-github/actions/plan-output@8e08d1ba957673f5fbf971a22b3219639dc45661 # v1.3.2
        with:
          plan: ${{ steps.run.outputs.plan_id }}

      - name: Summary
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          {
            echo "### HCP Terraform run for \`${WORKSPACE}\`"
            echo ""
            echo "| Add | Change | Destroy |"
            echo "| --- | --- | --- |"
            echo "| ${{ steps.plan.outputs.add }} | ${{ steps.plan.outputs.change }} | ${{ steps.plan.outputs.destroy }} |"
            echo ""
            echo "Run status: **${{ steps.run.outputs.run_status }}**. If there are changes, review the plan and"
            echo "click **Confirm & Apply** in HCP Terraform: ${{ steps.run.outputs.run_link }}"
          } >> "$GITHUB_STEP_SUMMARY"
