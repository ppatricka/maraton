# -----------------------------------------------------------------------------
# Pipeline 2: build the container image, scan it, push it to ECR, deploy to EKS.
#
#   pull request -> build + scan only (nothing is pushed or deployed)
#   push to main -> build + scan -> push to ECR -> roll out on EKS -> verify
#
# AWS access uses GitHub's OIDC token: no AWS keys are stored in GitHub.
# Every third-party action is pinned to a full commit SHA (supply-chain safety).
# -----------------------------------------------------------------------------
name: app

on:
  pull_request:
    paths: ["app/**", "k8s/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", "k8s/**", ".github/workflows/app.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: maraton-eks
  NAMESPACE: maraton
  IMAGE_TAG: ${{ github.sha }} # ECR tags are immutable, so every build gets a unique tag

jobs:
  build-scan-deploy:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26 on 2026-10-19
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for AWS
      security-events: write # lets the job upload scan results to the Security tab

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Misconfiguration scan of the Kubernetes manifests and the Dockerfile.
      - name: Config scan of k8s/ and Dockerfile (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: terraform
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          exit-code: "1"

      # GitHub's runners are x86 (linux/amd64), same as the EKS nodes.
      # CANDIDATE_NAME is written into /app/wizexercise.txt by the Dockerfile.
      - name: Build image
        run: |
          docker build \
            --build-arg CANDIDATE_NAME="Patricia Rojas Perez" \
            -t "maraton:${IMAGE_TAG}" app/

      # Results in the Security tab (never fails the build on its own).
      - name: Scan image (report to Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: maraton:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # The gate: stop here if there's a CRITICAL or HIGH vulnerability that has a fix.
      - name: Scan image (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: maraton:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      # ---- Everything below runs only on main (never on pull requests) ----

      - name: Get AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push image to ECR
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag "maraton:${IMAGE_TAG}" "${REGISTRY}/maraton:${IMAGE_TAG}"
          docker push "${REGISTRY}/maraton:${IMAGE_TAG}"

      - name: Set up kubectl
        if: github.ref == 'refs/heads/main'
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      # The deploy role can only "edit" the maraton namespace (see terraform/eks.tf),
      # so the pipeline updates the image; namespace and RBAC are managed by an admin.
      - name: Deploy to EKS
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"
          kubectl -n "${NAMESPACE}" set image deployment/maraton "maraton=${REGISTRY}/maraton:${IMAGE_TAG}"
          kubectl -n "${NAMESPACE}" rollout status deployment/maraton --timeout=180s

      - name: Verify running image and wizexercise.txt
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl -n "${NAMESPACE}" get deployment maraton -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          kubectl -n "${NAMESPACE}" exec deploy/maraton -- cat /app/wizexercise.txt
